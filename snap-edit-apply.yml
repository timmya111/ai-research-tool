            - textbox "Profile summary / research notes…" [ref=f79e818]: "Dallas-area photography / photo-finishing company. Public historical records and directories show **Snap Shots, Inc.** operating in the Dallas / North Texas photography and photo-finishing business from the late 1940s through at least the early 1980s, including locations at **1621 Oak Lawn Ave**, **1555 W. Mockingbird Ln**, and **1460 Prudential Dr** in Dallas. ### **Note on Board / Chair Members** Available historical directories and public search results do **not** identify specific board chair members or a full board of directors roster for **Snap Shots, Inc.** in Dallas. A September 1980 Tarleton alumni publication notes that the company's founder—who attended Tarleton, the University of Georgia, and the Navy/Air Force Academy—founded Snap Shots Inc. of Dallas in 1947 and served as its president and chief executive, though the snippet does not print the individual's name. ### **Timeline History & Listed Roles (Most Recent First)** * **April 1981** — Listed in the *Greater Dallas White Pages* at **1460 Prudential** (phone `638-6150`). * **October 1978** — Listed in the *Greater Dallas Yellow Pages* under wholesale photo finishing with an office at **1460 Prudential** (`638-6150`). - **August 10 1978** - employment reference letter, president **N. L. Williams** stated that **Connie Adams** had worked for Snap Shots, Inc. since * **1974** — Listed in the *Greater Dallas White Pages* with its office at 1460 Prudential (`638-6150`) and retail stores including Store No. 1 at 1621 Oak Lawn (`747-6691`) and Store No. 3 at 1555 W. Mockingbird Ln (`638-4661`). - **December 1973** - progressing from worker to supervisory management administration. * **1961** — Listed in the *Dallas City Directory* with employees such as Dorothy J. (salesman) and Lauretta J. (cutter). * **1957** — Listed in the *Dallas City Directory* with employees/staff including A. W. Nygard (supervisor), Ellen J. Kirbie (printer), and Bobby L. (clerk). * **1956** — Listed in the *Dallas City Directory* with staff including Helen (clerk) and Benorr Macoadden (press). * **1955** — Listed in the *Dallas City Directory* under photo finishing/services at 1621 Oak Lawn Ave. * **1947** — Founded in Dallas, Texas, as a photography and photo-finishing business (also appearing in 1947-dated copyright entries out of Dallas, Texas). If you have specific directory pages, corporate filings, or newspaper clippings naming a chair or officer, share them and I can extract and organize those names into the list."
